version: '3.8'

services:
  backend:
    build: .
    container_name: finnish_benefit_backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend/chroma_db:/app/backend/chroma_db
      - ./data:/app/data
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: always

  frontend:
    build: .
    container_name: finnish_benefit_frontend
    command: streamlit run frontend/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app/frontend
    environment:
      - FASTAPI_URL=http://backend:8000/ask
    depends_on:
      - backend
    restart: always